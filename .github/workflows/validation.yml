name: Build and dedicated validation
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedicated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and unit checks
        shell: pwsh
        run: |
          $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
          if ($IsWindows) { & ./gradlew.bat build acceptanceJar --console=plain $toolchain }
          else { & sh ./gradlew build acceptanceJar --console=plain $toolchain }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dedicated server and restart
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          node tools/validation/run.mjs --jar "build/libs/worldarchitect-$version.jar" --fixture "build/validation-tools/worldarchitect-$version-validation.jar" --output build/ci-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            build/ci-validation/results.json
            build/ci-validation/server/config/worldarchitect/diagnostics/*.json
            build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 30
