name: Build and dedicated validation
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedicated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and unit checks
        shell: pwsh
        run: |
          $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
          if ($IsWindows) { & ./gradlew.bat -I tools/validation/server.init.gradle build acceptanceJar benchmarkProbeJar packageTestKit prepareValidationServerRun --console=plain $toolchain }
          else { & sh ./gradlew -I tools/validation/server.init.gradle build acceptanceJar benchmarkProbeJar packageTestKit prepareValidationServerRun --console=plain $toolchain }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/workbench/scenario.test.mjs tools/workbench/batch.test.mjs tools/validation/benchmark-analysis.test.mjs tools/validation/identity.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve compiled mod for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiled-${{ matrix.os }}
          path: build/libs/Worlds-Unwritten-*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Standalone modpack kit
        shell: pwsh
        run: |
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          $neo = '26.3.0.103'
          $installer = Join-Path $PWD 'build/neoforge-installer.jar'
          $url = "https://maven.neoforged.net/releases/net/neoforged/neoforge/$neo/neoforge-$neo-installer.jar"
          Invoke-WebRequest $url -OutFile $installer
          $response = (Invoke-WebRequest "$url.sha256").Content
          $expected = if ($response -is [byte[]]) { [Text.Encoding]::UTF8.GetString($response) } else { [string]$response }
          if ($expected -notmatch (Get-FileHash $installer).Hash.ToLowerInvariant()) { throw 'Installer checksum differs' }
          & java -jar $installer --installServer build/ci-kit-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "build/release/Worlds-Unwritten-$version-test-kit.zip" build/ci-kit
          New-Item -ItemType Directory build/ci-kit-project,build/ci-kit-providers | Out-Null
          Copy-Item "examples/cell-worlds/bundles/expanding-one-chunk-$version.zip" build/ci-kit-project/preset.zip
          $hash = (Get-FileHash build/ci-kit-project/preset.zip).Hash.ToLowerInvariant()
          "format=2`nbundle=preset.zip`nsha256=$hash`nworldsunwritten=$version`nneoforge=$neo`n" | Set-Content build/ci-kit-project/testkit.properties
          & java -jar build/ci-kit/Worlds-Unwritten-test-kit.jar --server build/ci-kit-runtime --export build/ci-kit-project --providers build/ci-kit-providers --output build/ci-kit-results --eula true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a8b75541b53373dce638d952d2d18dc0b7b250b2 # v1.3.0
          path: build/frozen-1.3-source
          persist-credentials: false
      - name: Build the 1.3 batch fixture
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'build/validation-inputs'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Push-Location build/frozen-1.3-source
          try {
            $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
            if ($IsWindows) { & ./gradlew.bat acceptanceJar --console=plain $toolchain }
            else { & sh ./gradlew acceptanceJar --console=plain $toolchain }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -LiteralPath 'build/validation-tools/worldarchitect-1.3.0-validation.jar' -Destination (Join-Path $target 'worldarchitect-1.3.0-validation.jar')
          } finally { Pop-Location }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c062da90c909e9883a54007651abfd37536fa14a
          path: build/frozen-1.4-source
          persist-credentials: false
      - name: Build frozen 1.4 comparison input
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'build/validation-inputs'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Push-Location build/frozen-1.4-source
          try {
            $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
            if ($IsWindows) { & ./gradlew.bat jar --console=plain $toolchain }
            else { & sh ./gradlew jar --console=plain $toolchain }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $jar = 'build/libs/worldarchitect-1.4.0.jar'
            if ((Get-FileHash $jar).Hash.ToLowerInvariant() -ne '3684963461df2331c7f0fa4968d12b972fceff6c73c3568c77a19dcc66474fe4') { throw 'Frozen 1.4 source produced a different JAR' }
            Copy-Item -LiteralPath $jar -Destination (Join-Path $target 'worldarchitect-1.4.0.jar')
          } finally { Pop-Location }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.5.0
          path: build/frozen-1.5-source
          persist-credentials: false
      - name: Build published 1.5 comparison input
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'build/validation-inputs'
          Push-Location build/frozen-1.5-source
          try {
            $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
            if ($IsWindows) { & ./gradlew.bat jar --console=plain $toolchain }
            else { & sh ./gradlew jar --console=plain $toolchain }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $jar = 'build/libs/worldarchitect-1.5.0.jar'
            if ((Get-FileHash $jar).Hash.ToLowerInvariant() -ne '27a6a5e55567e04db4c93818daa2a866bd9bc0d0313780b08f17dcba1e20be42') { throw 'Published 1.5 source produced a different JAR' }
            Copy-Item -LiteralPath $jar -Destination (Join-Path $target 'worldarchitect-1.5.0.jar')
          } finally { Pop-Location }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ef7de4221eb464105e374a304b37bbcbc6a17156
          path: build/frozen-1.6-source
          persist-credentials: false
      - name: Build published 1.6 comparison input
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'build/validation-inputs'
          Push-Location build/frozen-1.6-source
          try {
            $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
            if ($IsWindows) { & ./gradlew.bat jar acceptanceJar --console=plain $toolchain }
            else { & sh ./gradlew jar acceptanceJar --console=plain $toolchain }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $jar = 'build/libs/worldarchitect-1.6.0.jar'
            if ((Get-FileHash $jar).Hash.ToLowerInvariant() -ne '57eda6cdd5dea8192fb252601c0c4366ac08cd4ae9d28d4c1cd115a333a84b56') { throw 'Published 1.6 source produced a different JAR' }
            Copy-Item -LiteralPath $jar -Destination (Join-Path $target 'worldarchitect-1.6.0.jar')
            Copy-Item -LiteralPath 'build/validation-tools/worldarchitect-1.6.0-validation.jar' -Destination (Join-Path $target 'worldarchitect-1.6.0-validation.jar')
          } finally { Pop-Location }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 559804d93a1124b55331cd14d8f4cee779a40606 # v1.9.0 API 1 contract
          path: build/frozen-1.9-source
          persist-credentials: false
      - name: Build the unchanged legacy API consumer
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'build/validation-inputs'
          Push-Location build/frozen-1.9-source
          try {
            $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
            if ($IsWindows) { & ./gradlew.bat jar --console=plain $toolchain }
            else { & sh ./gradlew jar --console=plain $toolchain }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $legacyJar = Join-Path $PWD 'build/libs/worldarchitect-1.9.0.jar'
            if ($IsWindows) { & ./gradlew.bat -p examples/api-fixture jar --console=plain $toolchain "-PworldArchitectJar=$legacyJar" }
            else { & sh ./gradlew -p examples/api-fixture jar --console=plain $toolchain "-PworldArchitectJar=$legacyJar" }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item 'examples/api-fixture/build/libs/worldarchitect-api-fixture-1.0.0.jar' (Join-Path $target 'legacy-api-fixture.jar')
          } finally { Pop-Location }
      - name: Build and verify the current API consumer
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          $toolchain = "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_21_X64"
          if ($IsWindows) { & ./gradlew.bat -p examples/api-fixture jar --console=plain $toolchain }
          else { & sh ./gradlew -p examples/api-fixture jar --console=plain $toolchain }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory build/ci-api-mods | Out-Null
          Copy-Item 'examples/api-fixture/build/libs/Worlds-Unwritten-api-fixture-1.0.0.jar' build/ci-api-mods/provider.jar
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          node tools/validation/run.mjs --jar "build/libs/Worlds-Unwritten-$version.jar" --fixture "build/validation-tools/Worlds-Unwritten-$version-validation.jar" --output build/ci-api --mods build/ci-api-mods --preset wa_api_fixture:laboratory --suite compatibility --api true --network online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Direct benchmark and memory sampler smoke
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          node tools/validation/benchmark-pairs.mjs --baseline build/validation-inputs/worldarchitect-1.6.0.jar --candidate "build/libs/Worlds-Unwritten-$version.jar" --probe "build/validation-tools/Worlds-Unwritten-$version-benchmark-probe.jar" --output build/ci-benchmark-smoke --pairs 1 --control-pairs 1 --warmup-size 8 --measured-size 6 --samples 2 --profiles void --port 25986 --purpose smoke --network online
          $benchmarkExit = $LASTEXITCODE
          $proof = Get-Content build/ci-benchmark-smoke/results.json -Raw | ConvertFrom-Json
          if ($proof.status -eq 'inconclusive' -and $proof.runs.Count -eq 2 -and @($proof.runs | Where-Object status -ne 'passed').Count -eq 0 -and @($proof.runs.samples | Where-Object { $null -eq $_.sampled_resident_peak_bytes -or $_.sampled_resident_peak_bytes -le 0 }).Count -eq 0) {
            Write-Output 'Sampler smoke completed. Identical-JAR controls were noisy; candidate comparisons were not started.'
            exit 0
          } elseif ($benchmarkExit -ne 0) { exit $benchmarkExit }
      - name: Dedicated server and restart
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          node tools/validation/run.mjs --jar "build/libs/Worlds-Unwritten-$version.jar" --fixture "build/validation-tools/Worlds-Unwritten-$version-validation.jar" --output build/ci-validation --network online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cell worlds and interrupted activation
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          $version = ((Get-Content gradle.properties | Where-Object { $_ -like 'mod_version=*' }) -split '=',2)[1]
          node tools/validation/cells.mjs --jar "build/libs/Worlds-Unwritten-$version.jar" --fixture "build/validation-tools/Worlds-Unwritten-$version-validation.jar" --output build/ci-cell-worlds --network online --crash true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exported assembly generation and restart
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/validation/assemblies.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Corridor, district, prepared and legacy generation and restart
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/validation/sites.mjs --network online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned public compatibility matrix
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/validation/compatibility.mjs --baseline-fixture build/validation-inputs/worldarchitect-1.6.0-validation.jar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean example bundle installations
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/validation/bundles.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workbench scenarios and rejected inputs
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/workbench/cases.mjs --network online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fingerprinted batch comparisons and cancellation
        shell: pwsh
        run: |
          $env:JAVA21_HOME = $env:JAVA_HOME_21_X64
          node tools/workbench/batch-cases.mjs --network online --baseline-fixture build/validation-inputs/worldarchitect-1.3.0-validation.jar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            build/ci-assemblies/results.json
            build/ci-assemblies/*/results.json
            build/ci-assemblies/*/*.log
            build/ci-sites/results.json
            build/ci-sites/*/results.json
            build/ci-sites/*/*.log
            build/ci-validation/results.json
            build/ci-api/results.json
            build/ci-api/*.log
            build/ci-kit-results/results.json
            build/ci-kit-results/stage-*.log
            build/ci-validation/*.log
            build/ci-compatibility/matrix.json
            build/ci-compatibility/cases/*/results.json
            build/ci-compatibility/cases/*/*.log
            build/ci-bundles.json
            build/ci-bundle-*/results.json
            build/ci-bundle-*/*.log
            build/ci-validation/server/config/worldsunwritten/diagnostics/*.json
            build/test-results/test/*.xml
            build/ci-benchmark-smoke/results.json
            build/ci-benchmark-smoke/inputs.json
            build/ci-benchmark-smoke/comparison.json
            build/ci-benchmark-smoke/**/console.log
            build/ci-workbench/results.json
            build/ci-workbench/prepare.log
            build/ci-workbench/*/results.json
            build/ci-workbench/*/clean-install/*.log
            build/ci-batch/results.json
            build/ci-batch/*/results.json
            build/ci-batch/*/report.html
            build/ci-batch/*.log
            build/ci-batch/matrix/*/runner.log
            build/ci-batch/matrix/*/instance/results.json
          if-no-files-found: error
          retention-days: 30
