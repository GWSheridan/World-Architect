pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
        }
        maven {
            url = 'https://maven.minecraftforge.net/'
            content { includeGroupByRegex 'net\\.minecraftforge(\\..*)?' }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Keep checkout settings in the buildable source distribution.
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitignore')
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitattributes')

rootProject.name = 'worldsunwritten'
include 'forge', 'fabric'
