sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    acceptance {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    packFixture {
        java.srcDir 'neoforge/src/packFixture/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    testKit { }
}
tasks.register('packFixtureJar', Jar) {
    group = 'distribution'
    dependsOn tasks.named('classes')
    from sourceSets.packFixture.output
    archiveClassifier = 'pack-test'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
}
tasks.register('testKitJar', Jar) {
    group = 'distribution'
    from sourceSets.testKit.output
    archiveClassifier = 'test-kit'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
    manifest { attributes 'Main-Class': 'com.gwsheridan.worldsunwritten.testkit.PackTestKit' }
}
tasks.named('processTestKitResources', ProcessResources) {
    def versions = [mod_version: mod_version, minecraft_version: minecraft_version, neo_version: neo_version,
                    forge_version: forge_version, fabric_loader_version: fabric_loader_version]
    inputs.properties versions
    filesMatching('testkit-runtime.properties') { expand versions }
}
tasks.register('packageTestKit', Zip) {
    group = 'distribution'
    dependsOn multiLoaderJars, tasks.named('packFixtureJar'), tasks.named('testKitJar'), ':forge:packFixtureJar', ':fabric:packFixtureJar'
    archiveClassifier = 'test-kit'
    destinationDirectory = releaseDirectory
    from(tasks.named('testKitJar')) { rename { 'Worlds-Unwritten-test-kit.jar' } }
    from(multiLoaderJars.map { it.destinationDir }) { into 'lib' }
    from(tasks.named('packFixtureJar')) { into 'lib'; rename { 'pack-test-neoforge.jar' } }
    ['forge', 'fabric'].each { loader ->
        from(project(":${loader}").layout.buildDirectory.file("validation-tools/pack-test-${loader}.jar")) { into 'lib' }
    }
    from('tools/pack-test')
    from('LICENSE')
}
tasks.named('packageRelease').configure {
    dependsOn tasks.named('packageTestKit')
    from(tasks.named('packageTestKit')) { into 'tools' }
}
tasks.register('benchmarkProbeJar', Jar) {
    group = 'verification'
    description = 'Build the separate, cross-version generation timing fixture.'
    dependsOn tasks.named('benchmarkClasses')
    from sourceSets.benchmark.output
    archiveClassifier = 'benchmark-probe'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
}
tasks.register('acceptanceJar', Jar) {
    group = 'verification'
    dependsOn tasks.named('classes')
    from sourceSets.acceptance.output
    archiveClassifier = 'validation'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
}
tasks.register('creatorAcceptanceJar', Jar) {
    group = 'verification'
    description = 'Build the client creator fixture with its two editable district examples.'
    dependsOn tasks.named('classes')
    from sourceSets.acceptance.output
    from 'src/acceptance/creator-resources'
    archiveClassifier = 'creator-validation'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
}
['jar', 'packFixtureJar', 'testKitJar', 'benchmarkProbeJar', 'acceptanceJar', 'creatorAcceptanceJar'].each { archiveTask ->
    tasks.named(archiveTask, Jar).configure { from('LICENSE') }
}

// Stable ordering and timestamps make the gameplay JAR reproducible from a clean extraction.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

