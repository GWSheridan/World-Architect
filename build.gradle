apply from: 'gradle/runtime-metadata.gradle'

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version
    }
}

def releaseDirectory = layout.buildDirectory.dir('release')
def loaderJarName = { loader -> "Worlds-Unwritten-${mod_version}-mc${minecraft_version}-${loader}.jar" }
def alternateJars = ['forge', 'fabric'].collect { loader ->
    project(":${loader}").layout.buildDirectory.file("libs/${loaderJarName(loader)}")
}
def multiLoaderJars = tasks.register('multiLoaderJars', Sync) {
    group = 'distribution'
    description = 'Build and collect the three playable loader JARs.'
    dependsOn tasks.named('jar'), ':forge:jar', ':fabric:jar'
    from(tasks.named('jar')) { rename { loaderJarName('neoforge') } }
    from(alternateJars)
    into layout.buildDirectory.dir('distribution')
}
