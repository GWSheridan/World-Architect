plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.gwsheridan.worldarchitect'
version = mod_version
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.test
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            if (providers.gradleProperty('testWorldDirectory').present) {
                gameDirectory = file(providers.gradleProperty('testWorldDirectory').get())
            }
        }
    }
    mods {
        worldarchitect { sourceSet sourceSets.main }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    workingDir = temporaryDir
}

tasks.register('checkDocumentation', JavaExec) {
    group = 'verification'
    description = 'Check local and versioned-source links in the shipped Markdown guides.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.DocumentationAudit'
    args layout.projectDirectory.asFile.absolutePath
}

tasks.named('check').configure { dependsOn tasks.named('checkDocumentation') }

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

tasks.register('auditTerrainWorld', JavaExec) {
    group = 'verification'
    description = 'Check every block in selected Single Block or Layered chunks from a stopped test server.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.TerrainWorldAudit'
    workingDir = temporaryDir
    def worldDirectory = layout.projectDirectory
    argumentProviders.add({
        [worldDirectory.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath, providers.gradleProperty('terrainChunks').get(),
         providers.gradleProperty('terrainPreset').orElse('single_block').get(),
         providers.gradleProperty('terrainBase').orElse('').get(),
         providers.gradleProperty('terrainDimension').orElse('minecraft:overworld').get()]
    } as CommandLineArgumentProvider)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('auditFeatureWorld', JavaExec) {
    group = 'verification'
    description = 'Audit the per-dimension feature example from a stopped dedicated server.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.FeatureWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({
        [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath,
         providers.gradleProperty('featureChunkOrigin').orElse('0').get(),
         providers.gradleProperty('featureFiltersExpected').orElse('false').get()]
    } as CommandLineArgumentProvider)
}

tasks.register('auditAdvancedTerrainWorld', JavaExec) {
    group = 'verification'
    description = 'Audit version 2 terrain, strata, and floating islands from the advanced terrain example.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.AdvancedTerrainWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({
        [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath,
         providers.gradleProperty('advancedTerrainChunkOrigin').orElse('0').get()]
    } as CommandLineArgumentProvider)
}

tasks.register('auditCrossDimensionWorld', JavaExec) {
    group = 'verification'
    description = 'Audit the dedicated cross-dimension End City and modular structure fixtures.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.CrossDimensionWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({
        [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath,
         providers.gradleProperty('structureChunkOrigin').orElse('0').get(),
         providers.gradleProperty('structureRuleFixtures').orElse('false').get()]
    } as CommandLineArgumentProvider)
}

tasks.register('auditVoidWorld', JavaExec) {
    group = 'verification'
    description = 'Check saved Void or Skyblock chunks against the pinned island template and air.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.VoidWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({
        [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath,
         providers.gradleProperty('terrainDimension').orElse('minecraft:overworld').get(),
         providers.gradleProperty('terrainChunks').get(),
         providers.gradleProperty('islandAllocations').orElse('').get(),
         providers.gradleProperty('islandAssignments').orElse('').get()]
    } as CommandLineArgumentProvider)
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: mod_version
    }
}

def releaseDirectory = layout.buildDirectory.dir('release')
tasks.register('auditExtensionWorld', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.ExtensionWorldAudit'
    argumentProviders.add({ [file(providers.gradleProperty('terrainWorld').get()).absolutePath, providers.gradleProperty('extensionChunkOrigin').orElse('32').get()] } as CommandLineArgumentProvider)
}
tasks.register('auditBenchmarkWorlds', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.BenchmarkWorldAudit'
    argumentProviders.add({ [file(providers.gradleProperty('benchmarkBaseline').get()).absolutePath, file(providers.gradleProperty('benchmarkCandidate').get()).absolutePath, providers.gradleProperty('benchmarkNativeControl').map { file(it).absolutePath }.orElse('').get()] } as CommandLineArgumentProvider)
}
tasks.register('auditStudioWorld', JavaExec) {
    group = 'verification'
    description = 'Audit the clean partial Preset Studio bundle and its allowed ore edits.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.StudioWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({ [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath] } as CommandLineArgumentProvider)
}
tasks.register('auditRuleWorld', JavaExec) {
    group = 'verification'
    description = 'Audit the floating city rule preset from a stopped dedicated server.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.RuleWorldAudit'
    workingDir = temporaryDir
    def root = layout.projectDirectory
    argumentProviders.add({ [root.dir(providers.gradleProperty('terrainWorld').get()).asFile.absolutePath,
                            providers.gradleProperty('ruleCityExpected').orElse('true').get(),
                            providers.gradleProperty('ruleExtraChunks').orElse('').get()] } as CommandLineArgumentProvider)
}
def releaseSources = tasks.register('releaseSources', Zip) {
    group = 'distribution'
    description = 'Package the complete buildable source tree.'
    archiveClassifier = 'source'
    destinationDirectory = releaseDirectory
    from(layout.projectDirectory) {
        exclude '**/build/**', '**/.gradle/**', '**/.gradle-local/**', '**/run/**'
        include 'src/**', 'gradle/**', 'docs/**', 'examples/**', '.github/**',
                'gradlew', 'gradlew.bat', 'build.gradle', 'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md', 'tools/**'
    }
    from('.gitignore', '.gitattributes')
}

tasks.register('packageRelease', Zip) {
    group = 'distribution'
    description = 'Package the mod, buildable sources, documentation, and example presets.'
    dependsOn tasks.named('check')
    archiveClassifier = 'release'
    destinationDirectory = releaseDirectory
    from(tasks.named('jar')) { into 'mods' }
    from(releaseSources) { into 'source' }
    from('README.md', 'CHANGELOG.md')
    from('docs') { into 'docs' }
    from('examples') { into 'examples'; exclude '**/build/**', '**/.gradle/**', '**/.gradle-local/**', '**/run/**' }
    def lockedBundle = providers.gradleProperty('releaseLockedBundle')
    if (lockedBundle.isPresent()) {
        from(file(lockedBundle.get())) { into 'examples/bundles' }
    }
}

tasks.register('releaseChecksums', JavaExec) {
    group = 'distribution'
    description = 'Build and stage the release assets with SHA-256 checksums.'
    dependsOn tasks.named('packageRelease')
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.ReleaseChecksums'
    argumentProviders.add({ [releaseDirectory.get().asFile.absolutePath,
        tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
        releaseSources.get().archiveFile.get().asFile.absolutePath,
        tasks.named('packageRelease').get().archiveFile.get().asFile.absolutePath,
        file('examples/preset-studio/bundles').absolutePath, project.version.toString(),
        file('examples/creator-starters/bundles').absolutePath, file('examples/assembly-studio/bundles').absolutePath,
        file('examples/regional-terrain/bundles').absolutePath, file('examples/procedural-pools/bundles').absolutePath] } as CommandLineArgumentProvider)
}

tasks.register('assembleRelease') {
    group = 'distribution'
    description = 'Build the JAR, source, full distribution, examples and checksums.'
    dependsOn tasks.named('releaseChecksums')
}

tasks.register('prepareExampleReleases', JavaExec) {
    group = 'distribution'
    description = 'Prepare new versioned examples from validated Studio exports, preserving earlier bundles.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.ReleaseExamples'
    argumentProviders.add({ [layout.projectDirectory.asFile.absolutePath,
        file(providers.gradleProperty('creatorExports').get()).absolutePath,
        providers.gradleProperty('exampleVersion').orElse(project.version.toString()).get()] } as CommandLineArgumentProvider)
}

tasks.register('prepareCycle13Examples', JavaExec) {
    group = 'distribution'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.ReleaseCycle13Examples'
    argumentProviders.add({ [layout.projectDirectory.asFile.absolutePath,
        file(providers.gradleProperty('regionalExport').get()).absolutePath,
        file(providers.gradleProperty('poolExport').get()).absolutePath, project.version.toString()] } as CommandLineArgumentProvider)
}

tasks.register('prepareWorkbenchInputs', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.WorkbenchInputs'
    argumentProviders.add({ [layout.projectDirectory.asFile.absolutePath,
        file(providers.gradleProperty('workbenchInputs').get()).absolutePath, project.version.toString()] } as CommandLineArgumentProvider)
}

sourceSets {
    acceptance {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('acceptanceJar', Jar) {
    group = 'verification'
    dependsOn tasks.named('classes')
    from sourceSets.acceptance.output
    archiveClassifier = 'validation'
    destinationDirectory = layout.buildDirectory.dir('validation-tools')
}
// Stable ordering and timestamps make the gameplay JAR reproducible from a clean extraction.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('prepareAssemblyExample', JavaExec) {
    group = 'distribution'
    description = 'Prepare a versioned example from the verified in-game assembly export.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.release.ReleaseAssemblyExample'
    argumentProviders.add({ [layout.projectDirectory.asFile.absolutePath,
        file(providers.gradleProperty('assemblyExport').get()).absolutePath,
        project.version.toString()] } as CommandLineArgumentProvider)
}

tasks.register('auditSavedChunkPair', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.SavedChunkPairAudit'
    argumentProviders.add({ [file(providers.gradleProperty('baselineWorld').get()).absolutePath,
        file(providers.gradleProperty('candidateWorld').get()).absolutePath,
        providers.gradleProperty('terrainDimension').get(), providers.gradleProperty('terrainChunks').get()] } as CommandLineArgumentProvider)
}

tasks.register('auditNativePyramidPair', JavaExec) {
    group = 'verification'
    description = 'Diagnose native pyramid burial variation while strictly comparing terrain outside its footprint.'
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    mainClass = 'com.gwsheridan.worldarchitect.worldgen.NativePyramidPairAudit'
    argumentProviders.add({ [file(providers.gradleProperty('baselineWorld').get()).absolutePath,
        file(providers.gradleProperty('candidateWorld').get()).absolutePath] } as CommandLineArgumentProvider)
}
