gradle.beforeProject { project ->
    project.pluginManager.withPlugin('net.neoforged.moddev') {
        project.neoForge.runs.create('validationServer') {
            server()
            loadedMods = []
            gameDirectory = project.file(project.providers.gradleProperty('testWorldDirectory').orElse('build/validation-server').get())
            programArgument '--nogui'
            def heap = project.providers.gradleProperty('workbenchHeapMib').orElse('1400').get().toInteger()
            if (heap < 768 || heap > 4096) throw new GradleException('Workbench heap must be 768..4096 MiB')
            jvmArgument "-Xmx${heap}m"
            jvmArgument '-XX:ActiveProcessorCount=4'
        }
        project.tasks.withType(JavaExec).configureEach {
            if (name == 'runValidationServer') standardInput = System.in
        }
        project.neoForge.runs.configureEach {
            if (name == 'server') {
                loadedMods = []
                def heap = project.providers.gradleProperty('workbenchHeapMib').orElse('1400').get().toInteger()
            if (heap < 768 || heap > 4096) throw new GradleException('Workbench heap must be 768..4096 MiB')
            jvmArgument "-Xmx${heap}m"
                jvmArgument '-XX:ActiveProcessorCount=4'
            }
        }
    }
}
