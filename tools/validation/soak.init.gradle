gradle.beforeProject { project ->
    project.pluginManager.withPlugin('net.neoforged.moddev') {
        def root = project.file(project.providers.gradleProperty('soakRoot').get())
        def stage = project.providers.gradleProperty('soakStage').get()
        project.neoForge.runs.create('soakServer') {
            server(); loadedMods = []; gameDirectory = new File(root, 'server')
            programArgument '--nogui'
            jvmArgument '-Xmx1600m'; jvmArgument '-XX:ActiveProcessorCount=4'
        }
        ['Alice', 'Bob', 'Carol', 'Dave'].each { player ->
            project.neoForge.runs.create('soak' + player) {
                client(); loadedMods = []; gameDirectory = new File(root, 'client-' + player.toLowerCase())
                programArguments.addAll('--username', 'WA12' + player, '--quickPlayMultiplayer', '127.0.0.1:' + project.providers.gradleProperty('soakPort').get(), '--width', '800', '--height', '500')
                jvmArgument '-Xmx1000m'; jvmArgument '-XX:ActiveProcessorCount=3'
                jvmArgument '-Dwa.validation.probe=' + new File(root, 'evidence/' + stage + '/' + player).absolutePath
            }
        }
        project.tasks.withType(JavaExec).configureEach { if (name == 'runSoakServer') standardInput = System.in }
    }
}
