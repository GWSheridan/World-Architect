plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0-test'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = '26.3.0.103'
    mods { wa_dragon_probe { sourceSet sourceSets.main } }
}
dependencies {
    implementation files(providers.gradleProperty('worldarchitectJar').orElse('../../build/libs/worldarchitect-1.1.0.jar').get())
}
