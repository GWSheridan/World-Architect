plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.gwsheridan.worldarchitect.fixture'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.3.0.103' }
dependencies {
    compileOnly files(providers.gradleProperty('worldArchitectJar').orElse('../../build/libs/worldarchitect-1.4.0.jar').get())
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
